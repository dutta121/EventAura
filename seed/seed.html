  // ── Global seeder function ───────────────────────────────────────────────
  window.runSeed = async function () {
    const btn = document.getElementById("seedBtn");
    const logDiv = document.getElementById("log");
    btn.disabled = true;
    logDiv.style.display = "block";
    logDiv.innerHTML = "";

    const log = (msg, cls = "log-info") => {
      const div = document.createElement("div");
      div.className = `log-line ${cls}`;
      div.textContent = msg;
      logDiv.appendChild(div);
      logDiv.scrollTop = logDiv.scrollHeight;
    };

    try {
      log("▶ Starting seed...", "log-info");

      // Seed categories
      log("📂 Uploading categories...", "log-info");
      for (const cat of CATEGORIES) {
        await setDoc(doc(db, "categories", cat.id), cat);
        log(`  ✓ Category: ${cat.name}`, "log-ok");
      }

      // Seed vendors
      log("🏪 Uploading vendors...", "log-info");
      for (const vendor of VENDORS) {
        const { id, ...data } = vendor;
        await setDoc(doc(db, "vendors", id), { ...data, createdAt: serverTimestamp() });
        log(`  ✓ Vendor: ${vendor.emoji} ${vendor.name} (${vendor.category})`, "log-ok");
      }

      log("", "");
      log(`🎉 Done! Uploaded ${CATEGORIES.length} categories + ${VENDORS.length} vendors.`, "log-done");
      log("You can now close this tab and open your EventAura app.", "log-info");
      btn.textContent = "✅ Seeding Complete!";
    } catch (err) {
      log(`❌ Error: ${err.message}`, "log-err");
      btn.disabled = false;
      btn.textContent = "🚀 Retry Seed";
    }
  };
